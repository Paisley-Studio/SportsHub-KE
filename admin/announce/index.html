<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, titleCase, fmtDate } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { F, toast, table, fld, run, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.announce = async () => {
  const rows = await db.list('announcements', { orderBy: ['at', 'desc'], limit: 30 });
  return html`${pageHead('Notifications and announcements', 'Sent in-app now. Email, SMS and push use the same pipeline when connected.')}<div class="grid g2"><form class="panel form" data-form="sendAnnounce">${fld({ name: 'title', label: 'Title', required: true })}${fld({ name: 'body', label: 'Message', type: 'textarea', required: true })}${fld({ name: 'audience', label: 'Audience', type: 'select', options: [['all', 'Everyone'], ['player', 'Players'], ['captain', 'Captains'], ['coach', 'Coaches'], ['vendor', 'Vendors'], ['facility', 'Facility owners'], ['organiser', 'Organisers']] })}<button class="btn" type="submit" style="justify-self:start">${ic('send')} Send</button></form>
   <section class="panel"><h3 class="mb">Sent</h3>${table([{ h: 'Title', v: a => a.title }, { h: 'Audience', v: a => titleCase(a.audience) }, { h: 'Reached', right: true, v: a => a.recipients }, { h: 'When', v: a => fmtDate(a.at) }], rows, html`<p class="small muted">Nothing sent yet.</p>`)}</section></div>`;
};
F.sendAnnounce = async v => { const r = await run('sendAnnouncement', v); toast(`Sent to ${r.recipients} members.`, 'green'); };
route('/admin/announce', adminPage('announce'), { shell: 'app', auth: true, admin: true, title: "Notifications and announcements" });
</script>
</body>
