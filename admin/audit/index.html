<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, fmtDT } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { table, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView, filt, adminSearch } from '/shared/js/features.js';

adminView.audit = async () => {
  const rows = filt(await db.list('auditLogs', { orderBy: ['at', 'desc'], limit: 300 }), 'q', l => `${l.action} ${l.target} ${l.actorId}`);
  return html`${pageHead('Audit logs', 'Written only by trusted operations, and read-only for everyone.', html`<button class="btn btn-ghost" data-act="exportCol" data-col="auditLogs">${ic('download')} Export</button>`)}${adminSearch('q', 'Filter by action, target or actor')}${table([{ h: 'When', v: l => fmtDT(l.at) }, { h: 'Actor', v: l => l.actorId }, { h: 'Action', v: l => html`<span class="semi">${l.action}</span>` }, { h: 'Target', v: l => l.target }, { h: 'Details', v: l => Object.keys(l.meta || {}).length ? JSON.stringify(l.meta) : '' }], rows)}`;
};
route('/admin/audit', adminPage('audit'), { shell: 'app', auth: true, admin: true, title: "Audit logs" });
</script>
</body>
</html>
