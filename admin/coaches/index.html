<script type="module">
import { html, fmtDate } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { SPORT, A, badge, table, fld, promptForm, run, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView, REVIEW_OPTS } from '/shared/js/features.js';

adminView.coaches = async () => {
  const rows = await db.list('coachApplications', { orderBy: ['submittedAt', 'desc'], limit: 100 });
  return html`${pageHead('Coach applications', 'Applicants must register three or more players. Approval grants verified coach privileges.')}${table([{ h: 'Applicant', v: a => html`<span class="semi">${a.name}</span><br><span class="xs faint">${a.county}${a.academy ? ` · ${a.academy}` : ''}</span>` }, { h: 'Sports', v: a => a.sports.map(s => SPORT(s).name).join(', ') }, { h: 'Experience', right: true, v: a => `${a.experienceYears} yrs` }, { h: 'Players', right: true, v: a => a.players.length }, { h: 'Submitted', v: a => fmtDate(a.submittedAt) }, { h: 'Status', v: a => badge(a.status) }, { h: '', act: true, v: a => html`<button class="btn btn-sm" data-act="reviewCoach" data-uid="${a.uid || a.id}">Review</button>` }], rows)}`;
};
A.reviewCoach = async d => {
  const a = await db.get('coachApplications', d.uid);
  const v = await promptForm({ title: `Review ${a.name}`, wide: true, intro: html`<dl class="kv small"><dt>Experience</dt><dd>${a.experience}</dd><dt>Qualifications</dt><dd>${a.qualifications}</dd><dt>Certificates</dt><dd>${(a.certificates || []).join(', ') || 'None listed'}</dd><dt>Documents</dt><dd>${(a.documents || []).length} attached</dd><dt>Players</dt><dd>${a.players.map(p => `${p.name} (${SPORT(p.sportId).name})`).join(', ')}</dd></dl>`, fields: html`${fld({ name: 'decision', label: 'Decision', type: 'select', required: true, options: REVIEW_OPTS, full: true })}${fld({ name: 'note', label: 'Note to the applicant', type: 'textarea', full: true })}`, submit: 'Record decision' });
  if (v) await run('reviewCoachApplication', { uid: d.uid, ...v }, 'Decision recorded.').catch(() => {});
};
route('/admin/coaches', adminPage('coaches'), { shell: 'app', auth: true, admin: true, title: "Coach applications" });
</script>
