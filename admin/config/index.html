<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, F, fld, run, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.config = async () => {
  const s = (await db.get('systemSettings', 'platform')) || S.settings;
  return html`${pageHead('System configuration', 'Sensitive settings. Each change records before and after values in the audit log.')}<form class="form" style="max-width:820px" data-form="saveConfig"><div class="form-grid">${fld({ name: 'registrationFee', label: 'Registration fee, KES', type: 'number', min: 0, value: s.registrationFee })}${fld({ name: 'membershipFee', label: 'Monthly membership fee, KES', type: 'number', min: 0, value: s.membershipFee })}${fld({ name: 'sessionsPerPeriod', label: 'Sessions per month', type: 'number', min: 1, value: s.sessionsPerPeriod })}${fld({ name: 'settlementRatePerSession', label: 'Facility settlement per session, KES', type: 'number', min: 0, value: s.settlementRatePerSession })}${fld({ name: 'commissionRate', label: 'Marketplace commission, 0 to 1', type: 'number', min: 0, max: 1, step: '0.01', value: s.commissionRate })}${fld({ name: 'cancelWindowHours', label: 'Free cancellation window, hours', type: 'number', min: 0, value: s.cancelWindowHours })}${fld({ name: 'strikeLimit', label: 'Strikes before restriction', type: 'number', min: 1, value: s.strikeLimit })}${fld({ name: 'restrictDays', label: 'Restriction length, days', type: 'number', min: 0, value: s.restrictDays })}${fld({ name: 'maxTransferCredits', label: 'Max sessions per transfer', type: 'number', min: 0, value: s.maxTransferCredits })}${fld({ name: 'autoApproveProducts', label: 'Publish new products without moderation', type: 'tick', value: s.autoApproveProducts })}</div><button class="btn" type="submit" style="justify-self:start">Save configuration</button></form>`;
};
F.saveConfig = async v => { await run('updateSettings', v, 'Configuration saved.'); S.settings = { ...S.settings, ...(await db.get('systemSettings', 'platform')) }; };
route('/admin/config', adminPage('config'), { shell: 'app', auth: true, admin: true, title: "System configuration" });
</script>
</body>
</html>
