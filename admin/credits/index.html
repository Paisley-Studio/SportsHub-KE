<script type="module">
import { html, titleCase, timeAgo, Rules } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { A, table, fld, promptForm, run, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.credits = async () => {
  const [periods, ledger] = await Promise.all([db.list('membershipPeriods', { where: [['status', '==', 'active']], limit: 300 }), db.list('membershipLedger', { orderBy: ['at', 'desc'], limit: 60 })]);
  const names = await db.list('users', { limit: 300 }), nm = id => (names.find(u => u.id === id) || { name: id }).name;
  return html`${pageHead('Session-credit management', 'Every change creates a ledger entry. Balances can never go negative.')}<div class="grid g2"><section class="panel"><h3 class="mb">Active balances</h3>${table([{ h: 'Member', v: p => nm(p.uid) }, { h: 'Used', right: true, v: p => p.used }, { h: 'Held', right: true, v: p => p.held }, { h: 'Left', right: true, v: p => Rules.remaining(p) }, { h: '', act: true, v: p => html`<button class="btn btn-sm btn-ghost" data-act="adjustCredit" data-uid="${p.uid}">Adjust</button>` }], periods)}</section>
  <section class="panel"><h3 class="mb">Latest ledger entries</h3>${table([{ h: 'When', v: l => timeAgo(l.at) }, { h: 'Member', v: l => nm(l.uid) }, { h: 'Entry', v: l => titleCase(l.type) }, { h: 'Change', right: true, v: l => l.delta || '' }, { h: 'Balance', right: true, v: l => l.balanceAfter }], ledger)}</section></div>`;
};
A.adjustCredit = async d => { const v = await promptForm({ title: 'Adjust session credits', intro: 'This action is audited.', fields: html`${fld({ name: 'delta', label: 'Change, positive or negative', type: 'number', min: -8, max: 8, required: true })}${fld({ name: 'reason', label: 'Reason', required: true })}`, submit: 'Apply' }); if (v) await run('adjustCredits', { uid: d.uid, ...v }, 'Credits adjusted.').catch(() => {}); };
route('/admin/credits', adminPage('credits'), { shell: 'app', auth: true, admin: true, title: "Session-credit management" });
</script>
