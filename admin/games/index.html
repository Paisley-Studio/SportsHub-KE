<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, fmtDT } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { badge, table, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.games = async () => {
  const rows = await db.list('games', { orderBy: ['start', 'desc'], limit: 150 });
  return html`${pageHead('Games and events', `${rows.length} games`)}${table([{ h: 'Game', v: g => html`<a class="semi" href="#/games/${g.id}">${g.title}</a><br><span class="xs faint">${g.sportName} · ${g.venueName}</span>` }, { h: 'When', v: g => fmtDT(g.start) }, { h: 'Host', v: g => g.hostName }, { h: 'Players', right: true, v: g => `${g.joined}/${g.capacity}` }, { h: 'Covered', v: g => g.covered ? 'Yes' : 'No' }, { h: 'Status', v: g => badge(g.status) }, { h: '', act: true, v: g => g.status === 'open' ? html`<button class="btn btn-sm btn-bad" data-act="cancelGame" data-game="${g.id}">Cancel</button>` : '' }], rows)}`;
};
route('/admin/games', adminPage('games'), { shell: 'app', auth: true, admin: true, title: "Games and events" });
</script>
</body>
</html>
