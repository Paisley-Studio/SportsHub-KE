<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, titleCase, fmtDate } from '/shared/js/core.js';
import { db, callOp } from '/shared/js/firebase.js';
import { A, toast, badge, table, fld, promptForm, run, renderMain, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView, filt, adminSearch } from '/shared/js/features.js';

/* ----- Finance ----- */
adminView.membership = async () => {
  const rows = filt(await db.list('memberships', { limit: 300 }), 'q', m => `${m.memberId} ${m.uid}`);
  const names = await db.list('users', { limit: 300 }), nm = id => (names.find(u => u.id === id) || { name: id }).name;
  return html`${pageHead('Membership management', '', html`<button class="btn btn-ghost" data-act="runSweep">${ic('refresh-cw')} Run expiry sweep</button>`)}${adminSearch('q', 'Search by member ID')}${table([{ h: 'Member', v: m => html`<span class="semi">${nm(m.uid || m.id)}</span><br><span class="xs faint">${m.memberId}</span>` }, { h: 'Registration', v: m => badge(m.registrationStatus === 'paid' ? 'paid' : m.registrationStatus === 'refunded' ? 'refunded' : 'pending') }, { h: 'Membership', v: m => badge(m.status) }, { h: 'Period ends', v: m => m.end ? fmtDate(m.end) : '' }, { h: 'Renewal', v: m => titleCase(m.renewal) }, { h: 'Strikes', right: true, v: m => m.strikes || 0 }, { h: '', act: true, v: m => html`<button class="btn btn-sm btn-ghost" data-act="suspendMember" data-uid="${m.uid || m.id}" data-v="${m.status === 'suspended' ? '' : '1'}">${m.status === 'suspended' ? 'Restore' : 'Suspend'}</button>` }], rows)}`;
};
A.runSweep = async () => { const r = await callOp('sweepMemberships', {}); toast(`Closed ${r.closed} periods and released ${r.released} stale reservations.`, 'green'); renderMain(); };
A.suspendMember = async d => { const v = await promptForm({ title: d.v ? 'Suspend membership' : 'Restore membership', fields: fld({ name: 'reason', label: 'Reason', required: true, full: true }), submit: 'Confirm' }); if (v) await run('membershipSuspend', { uid: d.uid, suspend: !!d.v, reason: v.reason }, 'Membership updated.').catch(() => {}); };
route('/admin/membership', adminPage('membership'), { shell: 'app', auth: true, admin: true, title: "Membership management" });
</script>
</body>
</html>
