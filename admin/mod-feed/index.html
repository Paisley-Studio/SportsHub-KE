<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, timeAgo } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { A, badge, table, run, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView, reportTable } from '/shared/js/features.js';

adminView['mod-feed'] = async () => {
  const [rows, posts] = await Promise.all([db.list('reports', { where: [['targetType', 'in', ['post', 'comment', 'product']]], limit: 100 }), db.list('socialPosts', { orderBy: ['at', 'desc'], limit: 40 })]);
  return html`${pageHead('Social feed moderation', '')}<section class="panel mb"><h3 class="mb">Reports</h3>${reportTable(rows)}</section><section class="panel"><h3 class="mb">Latest posts</h3>${table([{ h: 'Author', v: p => p.author.name }, { h: 'Post', v: p => p.text.slice(0, 120) }, { h: 'When', v: p => timeAgo(p.at) }, { h: 'Status', v: p => badge(p.status) }, { h: '', act: true, v: p => html`<button class="btn btn-sm btn-ghost" data-act="modPost" data-id="${p.id}" data-v="${p.status === 'published' ? '1' : ''}">${p.status === 'published' ? 'Remove' : 'Restore'}</button>` }], posts)}</section>`;
};
A.modPost = d => run('moderatePost', { id: d.id, remove: !!d.v }, 'Post updated.').catch(() => {});
route('/admin/mod-feed', adminPage('mod-feed'), { shell: 'app', auth: true, admin: true, title: "Social feed moderation" });
</script>
</body>
</html>
