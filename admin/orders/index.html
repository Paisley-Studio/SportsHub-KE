<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, money, fmtDate } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { badge, table, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.orders = async () => {
  const rows = await db.list('orders', { orderBy: ['createdAt', 'desc'], limit: 150 }), disputes = rows.filter(o => o.status === 'disputed');
  return html`${pageHead('Orders and disputes', '', html`<button class="btn btn-ghost" data-act="exportCol" data-col="orders">${ic('download')} Export</button>`)}
   ${disputes.length ? html`<section class="panel mb"><h3 class="mb">Open disputes</h3><div class="lines">${disputes.map(o => html`<div class="row between"><span><b>${o.number}</b> ${o.buyerName} and ${o.storeName}</span><span class="row sm"><button class="btn btn-sm btn-green" data-act="orderTo" data-id="${o.id}" data-v="completed">Close in seller's favour</button><button class="btn btn-sm btn-bad" data-act="orderTo" data-id="${o.id}" data-v="cancelled">Cancel and restock</button></span></div>`)}</div></section>` : ''}
   ${table([{ h: 'Order', v: o => o.number }, { h: 'Customer', v: o => o.buyerName }, { h: 'Store', v: o => o.storeName }, { h: 'Total', right: true, v: o => money(o.total) }, { h: 'Commission', right: true, v: o => money(o.commission) }, { h: 'Status', v: o => badge(o.status) }, { h: 'Date', v: o => fmtDate(o.createdAt) }], rows)}`;
};
route('/admin/orders', adminPage('orders'), { shell: 'app', auth: true, admin: true, title: "Orders and disputes" });
</script>
</body>
</html>
