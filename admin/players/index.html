<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, titleCase } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { SPORT, table, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView, filt, adminSearch } from '/shared/js/features.js';

adminView.players = async () => {
  const [rows, stats] = await Promise.all([db.list('playerProfiles', { limit: 300 }), db.list('playerStatistics', { where: [['source', '==', 'self']], limit: 60 })]);
  const shown = filt(rows, 'q', p => `${p.name} ${p.memberId} ${p.county}`);
  return html`${pageHead('Player management', `${rows.length} player profiles`)}${adminSearch('q', 'Search players')}${table([{ h: 'Player', v: p => html`<a class="semi" href="#/players/${p.id}">${p.name}</a><br><span class="xs faint">${p.memberId}</span>` }, { h: 'Sports', v: p => (p.sports || []).map(s => SPORT(s).name).join(', ') }, { h: 'County', v: p => p.county }, { h: 'Level', v: p => p.skill }, { h: 'Visibility', v: p => titleCase(p.visibility) }], shown)}
  <section class="panel mt-lg"><h3 class="mb">Self-reported records to verify</h3>${table([{ h: 'Player', v: s => { const p = rows.find(x => x.id === s.uid); return p ? p.name : s.uid; } }, { h: 'Sport', v: s => SPORT(s.sportId).name }, { h: 'Record', v: s => Object.entries(s.fields).map(([k, v]) => `${titleCase(k)}: ${v}`).join(' · ') }, { h: '', act: true, v: s => html`<button class="btn btn-sm btn-ghost" data-act="verifyStat" data-id="${s.id}">Verify</button>` }], stats, html`<p class="small muted">Nothing to verify.</p>`)}</section>`;
};
route('/admin/players', adminPage('players'), { shell: 'app', auth: true, admin: true, title: "Player management" });
</script>
</body>
</html>
