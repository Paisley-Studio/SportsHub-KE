<script type="module">

import { route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

/* ----- System ----- */
adminView.reports = async () => html`${pageHead('Reports and exports', 'CSV exports open safely in spreadsheets. Each export is logged.')}<div class="grid g3">${[['users', 'Users'], ['memberships', 'Memberships'], ['membershipLedger', 'Session ledger'], ['paymentTransactions', 'Payments'], ['orders', 'Marketplace orders'], ['facilityBookings', 'Facility bookings'], ['facilitySettlements', 'Settlements'], ['advertisingCampaigns', 'Campaigns'], ['games', 'Games'], ['teams', 'Teams'], ['tournaments', 'Tournaments'], ['auditLogs', 'Audit log']].map(([c, l]) => html`<button class="btn btn-ghost btn-block" data-act="exportCol" data-col="${c}" style="justify-content:space-between">${l} ${ic('download')}</button>`)}</div>`;
route('/admin/reports', adminPage('reports'), { shell: 'app', auth: true, admin: true, title: "Reports and exports" });
