<head>

<meta name="description" content="SportsHub-KE. One platform. Every sport. Every player.">

<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, money, dayKey } from '/shared/js/core.js';
import { db, callOp } from '/shared/js/firebase.js';
import { A, toast, badge, table, run, renderMain, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.settlements = async () => {
  const [rows, att] = await Promise.all([db.list('facilitySettlements', { orderBy: ['month', 'desc'], limit: 100 }), db.list('sessionAttendance', { where: [['settled', '==', false]], limit: 400 })]);
  const month = dayKey(new Date()).slice(0, 7);
  return html`${pageHead('Facility settlements', `${att.length} attended sessions awaiting settlement.`, html`<button class="btn btn-green" data-act="genSettlements" data-m="${month}">Generate for ${month}</button>`)}${table([{ h: 'Facility', v: s => s.facilityName }, { h: 'Month', v: s => s.month }, { h: 'Sessions', right: true, v: s => s.sessions }, { h: 'Rate', right: true, v: s => money(s.rate) }, { h: 'Amount', right: true, v: s => money(s.amount) }, { h: 'Status', v: s => badge(s.status) }, { h: '', act: true, v: s => s.status === 'draft' ? html`<button class="btn btn-sm" data-act="settleTo" data-id="${s.id}" data-v="approved">Approve</button>` : s.status === 'approved' ? html`<button class="btn btn-sm btn-green" data-act="settleTo" data-id="${s.id}" data-v="paid">Mark paid</button>` : '' }], rows)}`;
};
A.genSettlements = async d => { const r = await callOp('generateSettlements', { month: d.m }); toast(`${r.sessions} sessions settled across ${r.facilities} facilities.`, 'green'); renderMain(); };
A.settleTo = d => run('updateSettlement', { id: d.id, status: d.v }, `Settlement ${d.v}.`).catch(() => {});
route('/admin/settlements', adminPage('settlements'), { shell: 'app', auth: true, admin: true, title: "Facility settlements" });
</script>
</body>
</html>
