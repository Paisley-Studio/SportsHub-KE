<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, titleCase } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { badge, table, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.tournaments = async () => {
  const rows = await db.list('tournaments', { orderBy: ['start', 'desc'], limit: 100 });
  return html`${pageHead('Tournament management', '', html`<button class="btn btn-yellow" data-act="newTournament">${ic('plus')} Create a competition</button>`)}${table([{ h: 'Competition', v: t => html`<a class="semi" href="#/tournaments/${t.id}">${t.name}</a>` }, { h: 'Organiser', v: t => t.organiserName }, { h: 'Format', v: t => titleCase(t.format) }, { h: 'Entries', right: true, v: t => `${t.registered}/${t.capacity}` }, { h: 'Status', v: t => badge(t.status) }, { h: '', act: true, v: t => html`<a class="btn btn-sm btn-ghost" href="#/app/org/competitions/${t.id}">Manage</a>` }], rows)}`;
};
route('/admin/tournaments', adminPage('tournaments'), { shell: 'app', auth: true, admin: true, title: "Tournament management" });
</script>
</body>
</html>
