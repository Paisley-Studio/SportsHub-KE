<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { A, badge, table, run, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView } from '/shared/js/features.js';

adminView.transfers = async () => {
  const rows = await db.list('membershipTransfers', { orderBy: ['createdAt', 'desc'], limit: 100 });
  return html`${pageHead('Membership transfers', 'Sessions stay in escrow until approval, so they cannot be spent by both parties.')}${table([{ h: 'From', v: t => html`${t.fromName}<br><span class="xs faint">${t.fromMemberId}</span>` }, { h: 'To', v: t => html`${t.toName}<br><span class="xs faint">${t.toMemberId}</span>` }, { h: 'Sessions', right: true, v: t => t.credits }, { h: 'Reason', v: t => t.reason }, { h: 'Status', v: t => badge(t.status) }, { h: '', act: true, v: t => t.status === 'awaiting_approval' ? html`<button class="btn btn-sm btn-green" data-act="reviewTransfer" data-id="${t.id}" data-v="1">Approve</button><button class="btn btn-sm btn-ghost" data-act="reviewTransfer" data-id="${t.id}" data-v="">Reject</button>` : '' }], rows)}`;
};
A.reviewTransfer = d => run('reviewCreditTransfer', { id: d.id, approve: !!d.v }, d.v ? 'Transfer completed in both ledgers.' : 'Transfer rejected. Sessions returned.').catch(() => {});
route('/admin/transfers', adminPage('transfers'), { shell: 'app', auth: true, admin: true, title: "Membership transfers" });
</script>
</body>
</html>
