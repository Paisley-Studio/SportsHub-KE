<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { ROLE_LABEL, html, ic, titleCase } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { A, badge, table, fld, confirmBox, promptForm, run, route } from '/shared/js/ui.js';
import { pageHead, adminPage, adminView, filt, adminSearch } from '/shared/js/features.js';

/* ----- People ----- */
adminView.users = async () => {
  const rows = filt(await db.list('users', { limit: 300 }), 'q', u => `${u.name} ${u.memberId} ${u.county}`);
  const dels = await db.list('deletionRequests', { where: [['status', '==', 'pending']], limit: 30 });
  return html`${pageHead('User management', `${rows.length} accounts`, html`<button class="btn btn-ghost" data-act="exportCol" data-col="users">${ic('download')} Export</button>`)}${adminSearch('q', 'Search by name, ID or county')}
   ${dels.length ? html`<div class="panel mb"><h3 class="mb">Deletion requests</h3><div class="lines">${dels.map(d => html`<div class="row between"><span class="small"><b>${d.uid}</b> ${d.reason}</span><button class="btn btn-sm btn-bad" data-act="processDeletion" data-uid="${d.uid}">Delete personal data</button></div>`)}</div></div>` : ''}
   ${table([{ h: 'Member', v: u => html`<span class="semi">${u.name}</span><br><span class="xs faint">${u.memberId}</span>` }, { h: 'Location', v: u => u.county }, { h: 'Roles', v: u => (u.roles || []).map(r => ROLE_LABEL[r] || titleCase(r)).join(', ') }, { h: 'Registration', v: u => badge(u.registrationStatus === 'paid' ? 'paid' : 'pending') }, { h: 'Status', v: u => badge(u.status) }, { h: '', act: true, v: u => html`<button class="btn btn-sm ${u.status === 'suspended' ? 'btn-green' : 'btn-ghost'}" data-act="toggleSuspend" data-uid="${u.id}" data-to="${u.status === 'suspended' ? 'active' : 'suspended'}">${u.status === 'suspended' ? 'Restore' : 'Suspend'}</button>` }], rows)}`;
};
A.toggleSuspend = async d => {
  const v = await promptForm({ title: d.to === 'suspended' ? 'Suspend account' : 'Restore account', fields: fld({ name: 'reason', label: 'Reason', required: true, full: true, type: 'textarea' }), submit: 'Confirm', tone: d.to === 'suspended' ? 'btn-magenta' : '' });
  if (v) await run('setUserStatus', { uid: d.uid, status: d.to, reason: v.reason }, 'Account updated.').catch(() => {});
};
A.processDeletion = async d => { if (await confirmBox('Delete personal data?', 'Removes personal data for this account. Financial ledgers stay as legal records with no personal details.', 'Delete', 'btn-bad')) await run('processDeletion', { uid: d.uid }, 'Personal data removed.').catch(() => {}); };
route('/admin/users', adminPage('users'), { shell: 'app', auth: true, admin: true, title: "User management" });
</script>
