<!doctype html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Players on SportsHub | SportsHub-KE</title>
<meta name="description" content="Find players by sport and county.">
<meta name="theme-color" content="#FFFAF2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SportsHub-KE">
<meta property="og:title" content="Players on SportsHub | SportsHub-KE">
<meta property="og:description" content="Find players by sport and county.">
<meta property="og:image" content="/assets/photos/brand-banner.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/assets/branding/sportshub-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/sportshub.css">
<link rel="modulepreload" href="/shared/js/ui.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js" crossorigin>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { COUNTY_NAMES, html } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, SPORT, avatar, emptyState, table, route, pgHero } from '/shared/js/ui.js';
import { filterSelect } from '/shared/js/features.js';

/* ----- Athletes & profiles ----- */
route('/athletes', async () => {
  const q = S.query, where = [['visibility', '==', 'public']];
  if (q.sport) where.push(['sports', 'array-contains', q.sport]);
  if (q.county) where.push(['county', '==', q.county]);
  const rows = await db.list('playerProfiles', { where, limit: 50 });
  return html`${pgHero({ c: 'blue', c2: 'magenta', eye: 'Athletes', title: 'Players on SportsHub', lede: 'Public profiles only. Members choose what they show, and players under 18 never appear here.', cut: 'dunk' })}<div class="wrap section tight">
    <div class="grid mb" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">${filterSelect('sport', 'Sport', q.sport, S.sports.map(s => [s.id, s.name]), 'Every sport')}${filterSelect('county', 'County', q.county, COUNTY_NAMES, 'All counties')}</div>
    ${rows.length ? table([{ h: 'Player', v: p => html`<a class="row nowrap semi" href="#/players/${p.id}">${avatar(p.name, p.photo, 'sm')}${p.name}</a>` }, { h: 'Sports', v: p => (p.sports || []).map(s => SPORT(s).name).join(', ') }, { h: 'Level', v: p => p.skill }, { h: 'Location', v: p => `${p.town}, ${p.county}` }], rows) : emptyState('user', 'No public profiles match', 'Try another sport or county.')}</div>`;
}, { title: 'Athletes', desc: 'Find players by sport and county.' });
</script>
</body>
</html>
