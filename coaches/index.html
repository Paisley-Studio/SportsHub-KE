<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { COUNTY_NAMES, html } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, emptyState, route, pgHero } from '/shared/js/ui.js';
import { coachLine, filterSelect } from '/shared/js/features.js';

/* ----- Coaches ----- */
route('/coaches', async () => {
  const q = S.query, where = [['verified', '==', true]];
  if (q.county) where.push(['county', '==', q.county]);
  if (q.sport) where.push(['sports', 'array-contains', q.sport]);
  const rows = await db.list('coaches', { where, limit: 50 });
  return html`${pgHero({ c: 'yellow', c2: 'blue', eye: 'Coaches and academies', title: 'Learn from verified coaches', lede: 'Every coach here has been reviewed by our verification team.', cut: 'tennis', action: html`<a class="btn btn-yellow" href="#/join/coach">Apply as a coach</a>` })}<div class="wrap section tight">
    <div class="grid mb" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">${filterSelect('sport', 'Sport', q.sport, S.sports.map(s => [s.id, s.name]), 'Every sport')}${filterSelect('county', 'County', q.county, COUNTY_NAMES, 'All counties')}</div>
    ${rows.length ? html`<div class="panel lines">${rows.map(c => html`<div class="seq">${coachLine(c)}</div>`)}</div>` : emptyState('clipboard-list', 'No verified coaches match', 'Try a different sport or county.')}</div>`;
}, { title: 'Coaches', desc: 'Verified coaches and academies.' });
</script>
</body>
</html>
