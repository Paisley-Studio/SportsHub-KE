<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, SPORT, A, badge, avatar, stars, fld, promptForm, run, notFound, route, pgHero } from '/shared/js/ui.js';

A.requestCoach = async d => {
  const v = await promptForm({ title: 'Contact this coach', fields: fld({ name: 'message', label: 'What would you like to work on?', type: 'textarea', full: true }), submit: 'Send request' });
  if (v) await run('requestCoach', { coachId: d.id, message: v.message }, 'Request sent to the coach.').catch(() => {});
};
route('/coaches/:id', async ({ id }) => {
  const c = await db.get('coaches', id);
  if (!c) return notFound();
  S.pageTitle = c.name;
  S.pageDesc = `${c.name}${c.verified ? ', verified' : ''} ${(c.sports || []).map(x => SPORT(x).name || x).join(', ')} coach in ${c.area || c.county || 'Kenya'}. ${c.experienceYears ? `${c.experienceYears} years of experience. ` : ''}Train with them on SportsHub-KE.`;
  S.pageImage = c.photo;
  S.pageLd = { '@type': 'Person', name: c.name, jobTitle: 'Sports coach', description: c.bio || '', ...(c.photo ? { image: new URL(c.photo, location.href).href } : {}), knowsAbout: (c.sports || []).map(x => SPORT(x).name || x), address: { '@type': 'PostalAddress', addressRegion: c.county || '', addressCountry: 'KE' }, url: location.href };
  const reviews = await db.list('reviews', { where: [['targetType', '==', 'coach'], ['targetId', '==', id]], limit: 10 });
  const req = S.uid ? await db.get('coachRequests', `${id}_${S.uid}`) : null;
  return html`${pgHero({ c: 'yellow', c2: 'magenta', eye: (c.sports || []).map(x => SPORT(x).name).join(', '), title: c.name, lede: `${c.area || ''}${c.area ? ', ' : ''}${c.county}${c.verified ? ' · Verified coach' : ''}` })}<div class="wrap section tight"><div class="row between">${avatar(c.name, c.photo, 'lg')}
    <div class="row">${S.uid && S.uid !== id ? (req ? badge(req.status) : c.accepting ? html`<button class="btn btn-yellow" data-act="requestCoach" data-id="${id}">Train with ${c.name.split(' ')[0]}</button>` : html`<span class="badge">Not accepting players</span>`) : ''}${!S.uid ? html`<a class="btn btn-yellow" href="#/signin">Sign in to connect</a>` : ''}</div></div>
    <div class="grid g-side section tight"><div class="stack lg"><p class="lede">${c.bio}</p><dl class="kv"><dt>Experience</dt><dd>${c.experienceYears} years</dd><dt>Qualifications</dt><dd>${c.qualifications || 'On file'}</dd>${c.academy ? html`<dt>Academy</dt><dd>${c.academy}</dd>` : ''}<dt>Players</dt><dd>${c.playerCount || 0}</dd></dl></div>
    <aside class="panel"><h3 class="mb">Reviews</h3>${reviews.length ? html`<div class="lines">${reviews.map(r => html`<div>${stars(r.rating)}<p class="small">${r.text}</p><span class="xs faint">${r.name}</span></div>`)}</div>` : html`<p class="small muted">No reviews yet.</p>`}</aside></div></div>`;
});
</script>
