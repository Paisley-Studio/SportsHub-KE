<script type="module">
import { html } from '/shared/js/core.js';
import { page, S, F, fld, run } from '/shared/js/ui.js';
import { appRoute, pageHead, coachGate } from '/shared/js/features.js';

F.saveCoach = v => run('updateCoach', v, 'Profile saved.');
appRoute('/app/coach/academy', async () => {
  const { co, gate } = await coachGate(); if (gate) return gate;
  return page(pageHead('Academy profile', 'What players see on your public page.', html`<a class="btn btn-ghost" href="#/coaches/${S.uid}">View public page</a>`), html`<form class="form" style="max-width:720px" data-form="saveCoach">${fld({ name: 'academy', label: 'Academy or club', value: co.academy })}${fld({ name: 'bio', label: 'About your coaching', type: 'textarea', rows: 5, value: co.bio })}${fld({ name: 'accepting', label: 'Accepting new players', type: 'tick', value: co.accepting })}<button class="btn" type="submit" style="justify-self:start">Save</button></form>`);
}, 'Academy profile');
</script>
