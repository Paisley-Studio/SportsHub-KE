<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, fmtDate } from '/shared/js/core.js';
import { db, callOp } from '/shared/js/firebase.js';
import { page, S, SPORT, A, table, fld, sportOptions, promptForm, run, go } from '/shared/js/ui.js';
import { appRoute, pageHead, coachGate } from '/shared/js/features.js';

A.rosterAdd = async () => {
  const v = await promptForm({ title: 'Add a player', fields: html`${fld({ name: 'memberId', label: 'SportsHub ID, if any' })}${fld({ name: 'name', label: 'Player name' })}${fld({ name: 'sportId', label: 'Sport', type: 'select', options: sportOptions(), required: true })}${fld({ name: 'position', label: 'Position or event' })}`, submit: 'Add player', tone: 'btn-yellow' });
  if (v) await run('rosterAdd', v, 'Added to your roster.').catch(() => {});
};
A.messageCoachPlayer = async d => { const r = await callOp('startConversation', { type: 'coach', members: [d.uid] }); go(`/app/messages/${r.id}`); };
A.rosterOpen = async d => {
  const r = await db.get('coachRoster', d.id);
  const v = await promptForm({ title: r.name, wide: true, intro: html`${(r.metrics || []).length ? html`<span class="semi">Performance: </span>${r.metrics.map(m => `${m.label} ${m.value} (${fmtDate(m.at)})`).join(' · ')}<br>` : ''}${(r.notes || []).map(n => html`<span class="small">${fmtDate(n.at)}: ${n.text}</span><br>`)}`, fields: html`${fld({ name: 'note', label: 'Add a development note', type: 'textarea', full: true })}${fld({ name: 'metric', label: 'Performance measure', placeholder: '800m' })}${fld({ name: 'value', label: 'Value', placeholder: '2:08' })}${fld({ name: 'remove', label: 'Remove this player from my roster', type: 'tick', full: true })}`, submit: 'Save' });
  if (v) await run('rosterUpdate', { id: d.id, note: v.note, metric: v.metric, value: v.value, remove: v.remove }, 'Saved.').catch(() => {});
};
appRoute('/app/coach/roster', async () => {
  const { gate } = await coachGate(); if (gate) return gate;
  const rows = await db.list('coachRoster', { where: [['coachId', '==', S.uid], ['status', '==', 'active']], limit: 100 });
  const reqs = await db.list('coachRequests', { where: [['coachId', '==', S.uid], ['status', '==', 'pending']], limit: 20 });
  return page(pageHead('Roster', 'Development notes and performance records stay private to you.', html`<button class="btn btn-yellow" data-act="rosterAdd">${ic('user-plus')} Add a player</button>`),
    reqs.length ? html`<div class="panel mb"><h3 class="mb">Requests</h3><div class="lines">${reqs.map(r => html`<div class="row between"><span class="semi">${r.name}</span><span class="row sm"><button class="btn btn-sm btn-yellow" data-act="reviewCoachReq" data-id="${r.id}" data-v="1">Accept</button><button class="btn btn-sm btn-ghost" data-act="reviewCoachReq" data-id="${r.id}" data-v="">Decline</button></span></div>`)}</div></div>` : '',
    table([{ h: 'Player', v: r => r.uid ? html`<a class="semi" href="#/players/${r.uid}">${r.name}</a>` : html`<span class="semi">${r.name}</span>` }, { h: 'Sport', v: r => SPORT(r.sportId).name }, { h: 'Position', v: r => r.position || '' }, { h: 'Latest', v: r => { const m = (r.metrics || []).slice(-1)[0]; return m ? `${m.label}: ${m.value}` : ''; } }, { h: 'Notes', right: true, v: r => (r.notes || []).length }, { h: '', act: true, v: r => html`<button class="btn btn-sm btn-ghost" data-act="rosterOpen" data-id="${r.id}">Development</button>${r.uid ? html`<button class="btn btn-sm btn-ghost" data-act="messageCoachPlayer" data-uid="${r.uid}">Message</button>` : ''}` }], rows));
}, 'Roster');
</script>
</body>
</html>
