<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, money, titleCase, fmtDT } from '/shared/js/core.js';
import { db, callOp } from '/shared/js/firebase.js';
import { page, S, A, toast, showErr, badge, emptyState, table, run, setQuery, renderMain, refreshSession } from '/shared/js/ui.js';
import { nowISO, appRoute, pageHead, facilityGate, facSwitch } from '/shared/js/features.js';

A.setV = d => setQuery({ v: d.v });
A.reviewBooking = d => run('reviewBooking', { id: d.id, approve: !!d.v }, d.v ? 'Booking approved.' : 'Booking rejected.').catch(() => {});
A.checkIn = async d => {
  try {
    const r = await callOp('checkInBooking', { id: d.id, attended: !!d.v }); await refreshSession();
    toast(!d.v ? 'Marked as no-show. No credit was used.' : r.consumed ? `Checked in. One session used, ${r.remaining} left for this member.` : r.already ? 'Already recorded.' : 'Checked in.', 'green'); renderMain();
  } catch (e) { showErr(e); }
};
appRoute('/app/facility/bookings', async () => {
  const { f, mine, gate } = await facilityGate(); if (gate) return gate;
  const rows = await db.list('facilityBookings', { where: [['ownerId', '==', S.uid], ['facilityId', '==', f.id]], orderBy: ['start', 'asc'], limit: 200 });
  const now = nowISO(), filter = S.query.v || 'up', shown = rows.filter(b => filter === 'up' ? b.end > now && !['cancelled', 'rejected'].includes(b.status) : filter === 'pending' ? b.status === 'pending' : filter === 'past' ? b.end <= now || ['cancelled', 'rejected', 'checked_in', 'no_show'].includes(b.status) : true);
  return page(pageHead('Bookings and check-ins', 'Checking a member in is what uses their session and counts toward your settlement.'), facSwitch(f, mine),
    html`<div class="tabs c-green">${[['up', 'Upcoming'], ['pending', 'To approve'], ['past', 'Past']].map(([k, l]) => html`<button class="tab ${filter === k ? 'on' : ''}" data-act="setV" data-v="${k}">${l}</button>`)}</div>`,
    table([{ h: 'When', v: b => fmtDT(b.start) }, { h: 'Space', v: b => b.resourceName }, { h: 'Booked by', v: b => b.kind === 'maintenance' ? b.note : html`<span class="semi">${b.userName}</span>${b.memberId ? html`<br><span class="xs faint">${b.memberId}</span>` : ''}` }, { h: 'Type', v: b => b.kind === 'covered' ? html`<span class="badge ok">Member session</span>` : titleCase(b.kind) }, { h: 'Fee', right: true, v: b => b.kind === 'covered' ? 'None' : b.price ? money(b.price) : '' }, { h: 'Status', v: b => badge(b.status) }, { h: '', act: true, v: b => html`${b.status === 'pending' ? html`<button class="btn btn-sm btn-green" data-act="reviewBooking" data-id="${b.id}" data-v="1">Approve</button><button class="btn btn-sm btn-ghost" data-act="reviewBooking" data-id="${b.id}" data-v="">Reject</button>` : ''}${b.status === 'confirmed' && !['maintenance', 'game'].includes(b.kind) ? html`<button class="btn btn-sm btn-green" data-act="checkIn" data-id="${b.id}" data-v="1">Check in</button><button class="btn btn-sm btn-ghost" data-act="checkIn" data-id="${b.id}" data-v="">No-show</button>` : ''}${b.kind === 'game' ? html`<a class="btn btn-sm btn-ghost" href="#/games/${b.gameId}">Game attendance</a>` : ''}${b.status === 'confirmed' && b.kind !== 'game' && b.start > now ? html`<button class="btn btn-sm btn-ghost" data-act="cancelBooking" data-id="${b.id}">Cancel</button>` : ''}` }], shown, emptyState('ticket', 'Nothing here', 'Bookings appear as members and customers reserve your spaces.')));
}, 'Bookings and check-ins');
</script>
