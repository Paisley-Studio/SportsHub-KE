<script type="module">
import { html, money } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, badge, metrics, table, barChart } from '/shared/js/ui.js';
import { appRoute, pageHead, lastMonths, monthLabel, facilityGate, facSwitch } from '/shared/js/features.js';

appRoute('/app/facility/settlements', async () => {
  const { f, mine, gate } = await facilityGate(); if (gate) return gate;
  const [sets, att, bookings] = await Promise.all([db.list('facilitySettlements', { where: [['ownerId', '==', S.uid], ['facilityId', '==', f.id]], orderBy: ['month', 'desc'], limit: 24 }), db.list('sessionAttendance', { where: [['facilityId', '==', f.id]], limit: 400 }), db.list('facilityBookings', { where: [['ownerId', '==', S.uid], ['facilityId', '==', f.id]], limit: 300 })]);
  const unsettled = att.filter(a => !a.settled).length, rate = S.settings.settlementRatePerSession, ext = bookings.filter(b => ['external', 'private'].includes(b.kind) && ['confirmed', 'checked_in'].includes(b.status));
  const ms = lastMonths(6).map(k => ({ l: monthLabel(k), v: ext.filter(b => b.start.slice(0, 7) === k).reduce((a, b) => a + b.price, 0) + (sets.find(s => s.month === k) || { amount: 0 }).amount }));
  return page(pageHead('Revenue and settlements', `Attended member sessions settle at ${money(rate)} per session.`), facSwitch(f, mine),
    metrics([[unsettled, 'Sessions awaiting settlement'], [money(unsettled * rate), 'Accrued'], [money(sets.filter(s => s.status === 'paid').reduce((a, s) => a + s.amount, 0)), 'Settled to date'], [money(ext.reduce((a, b) => a + b.price, 0)), 'External bookings']]),
    html`<div class="grid g2 mt-lg"><section class="panel"><h3 class="mb">Revenue by month</h3>${barChart(ms, { c: 'var(--green)' })}</section><section class="panel"><h3 class="mb">Settlement statements</h3>${table([{ h: 'Month', v: s => s.month }, { h: 'Sessions', right: true, v: s => s.sessions }, { h: 'Amount', right: true, v: s => money(s.amount) }, { h: 'Status', v: s => badge(s.status) }], sets, html`<p class="small muted">Statements are issued monthly by our finance team.</p>`)}</section></div>`);
}, 'Revenue and settlements');
</script>
