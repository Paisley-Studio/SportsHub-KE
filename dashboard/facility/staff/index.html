<script type="module">
import { html, ic } from '/shared/js/core.js';
import { page, A, emptyState, table, fld, promptForm, run } from '/shared/js/ui.js';
import { appRoute, pageHead, facilityGate, facSwitch } from '/shared/js/features.js';

A.addStaff = async d => { const v = await promptForm({ title: 'Add staff', fields: html`${fld({ name: 'memberId', label: 'SportsHub ID', required: true, placeholder: 'SH-KE-001234' })}${fld({ name: 'role', label: 'Role', required: true, value: 'Attendant' })}`, submit: 'Add', tone: 'btn-green' }); if (v) await run('addFacilityStaff', { facilityId: d.f, ...v }, 'Staff added.').catch(() => {}); };
A.removeStaff = d => run('removeFacilityStaff', { facilityId: d.f, uid: d.uid }, 'Staff removed.').catch(() => {});
appRoute('/app/facility/staff', async () => {
  const { f, mine, gate } = await facilityGate(); if (gate) return gate;
  return page(pageHead('Staff', 'Staff can check members in and manage bookings at this facility.', html`<button class="btn btn-green" data-act="addStaff" data-f="${f.id}">${ic('user-plus')} Add staff</button>`), facSwitch(f, mine),
    table([{ h: 'Name', v: s => html`<span class="semi">${s.name}</span>` }, { h: 'Role', v: s => s.role }, { h: '', act: true, v: s => html`<button class="btn btn-sm btn-ghost" data-act="removeStaff" data-f="${f.id}" data-uid="${s.uid}">Remove</button>` }], f.staff || [], emptyState('id-card', 'No staff yet', 'Add a SportsHub member as duty manager or attendant.')));
}, 'Staff');
</script>
