<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, timeAgo } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, F, run } from '/shared/js/ui.js';
import { appRoute, pageHead, orgGate } from '/shared/js/features.js';

F.orgPost = v => run('createPost', { text: v.text, kind: 'announcement', visibility: 'public' }, 'Published.');
appRoute('/app/org/announcements', async () => {
  const { gate } = await orgGate(); if (gate) return gate;
  const posts = (await db.list('socialPosts', { where: [['authorUid', '==', S.uid], ['status', '==', 'published']], orderBy: ['at', 'desc'], limit: 20 }));
  return page(pageHead('Announcements', 'Publish to the community feed.'), html`<form class="form panel" style="max-width:720px" data-form="orgPost"><div class="field"><label for="op">Announcement</label><textarea id="op" name="text" rows="3" required maxlength="1500"></textarea></div><button class="btn btn-yellow" type="submit" style="justify-self:start">Publish</button></form>
    <div class="lines mt-lg">${posts.map(p => html`<div><p>${p.text}</p><span class="xs faint">${timeAgo(p.at)}</span></div>`)}</div>`);
}, 'Announcements');
</script>
</body>
</html>
