<script type="module">
import { html, money } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, badge, emptyState, table } from '/shared/js/ui.js';
import { appRoute, pageHead, orgGate } from '/shared/js/features.js';

appRoute('/app/org/registrations', async () => {
  const { gate } = await orgGate(); if (gate) return gate;
  const regs = await db.list('tournamentRegistrations', { where: [['organiserId', '==', S.uid]], limit: 300 });
  return page(pageHead('Registrations', ''), table([{ h: 'Entrant', v: r => html`<span class="semi">${r.entrantName}</span>` }, { h: 'Competition', v: r => html`<a href="#/app/org/competitions/${r.tournamentId}">${r.tournamentName}</a>` }, { h: 'Fee', right: true, v: r => money(r.feeDue) }, { h: 'Status', v: r => badge(r.status) }, { h: '', act: true, v: r => r.status === 'pending' ? html`<button class="btn btn-sm btn-yellow" data-act="reviewEntry" data-id="${r.id}" data-v="1">Confirm</button><button class="btn btn-sm btn-ghost" data-act="reviewEntry" data-id="${r.id}" data-v="">Decline</button>` : '' }], regs, emptyState('clipboard-list', 'No registrations yet', 'Entries appear here.')));
}, 'Registrations');
</script>
