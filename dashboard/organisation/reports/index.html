<meta property="og:title" content="Reports | SportsHub-KE">
<meta property="og:description" content="SportsHub-KE. One platform. Every sport. Every player.">
<meta property="og:image" content="/assets/photos/brand-banner.webp">

<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, pct, csvDownload } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, A, hbars } from '/shared/js/ui.js';
import { appRoute, pageHead, orgGate } from '/shared/js/features.js';

A.exportTournaments = async () => { const ts = await db.list('tournaments', { where: [['organiserId', '==', S.uid]], limit: 200 }); csvDownload('competitions.csv', ts.map(t => ({ name: t.name, sport: t.sportName, format: t.format, start: t.start, entries: t.registered, capacity: t.capacity, status: t.status, winner: t.winner }))); };
appRoute('/app/org/reports', async () => {
  const { gate } = await orgGate(); if (gate) return gate;
  const ts = await db.list('tournaments', { where: [['organiserId', '==', S.uid]], limit: 50 });
  return page(pageHead('Reports', '', html`<button class="btn btn-ghost" data-act="exportTournaments">${ic('download')} Export CSV</button>`), html`<section class="panel"><h3 class="mb">Fill rate by competition</h3>${ts.length ? hbars(ts.map(t => [t.name, pct(t.registered, t.capacity)]), 'var(--yellow)', v => `${v}%`) : html`<p class="small muted">No competitions yet.</p>`}</section>`);
}, 'Reports');
</script>
</body>
</html>
