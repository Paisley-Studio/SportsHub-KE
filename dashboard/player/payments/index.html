<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, money, fmtDT } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, A, badge, emptyState, table, openModal, metrics, renderMain, refreshSession, toast } from '/shared/js/ui.js';
import { receiptHtml, appRoute, pageHead, paymentFlow } from '/shared/js/features.js';

/* ----- Payment records: every registration, membership and marketplace payment, with receipts ----- */
const STATUS_NOTE = { awaiting_verification: 'We are confirming your M-Pesa code.', rejected: 'Not confirmed.', pending: 'Not finished.' };
A.viewReceipt = async d => { const t = await db.get('paymentTransactions', d.id); openModal({ title: 'Payment receipt', body: html`${t.simulated ? html`<div class="notice c-yellow small mb">Simulated transaction. Not a real payment.</div>` : ''}${receiptHtml(t)}`, foot: html`<button class="btn btn-ghost" data-act="printReceipt">${ic('printer')} Print</button><button class="btn" data-act="closeModal">Close</button>` }).then(() => {}); };
/* A payment opened but never finished can be completed later with its M-Pesa code. */
A.finishPayment = async d => {
  const t = await db.get('paymentTransactions', d.id); if (!t) return;
  const outcome = await paymentFlow({ txId: t.id, amount: t.amount, description: t.description });
  if (outcome === 'submitted') toast('Payment submitted. We will confirm it and let you know.', 'blue');
  await refreshSession(); renderMain();
};
appRoute('/app/payments', async () => {
  const rows = await db.list('paymentTransactions', { where: [['uid', '==', S.uid]], orderBy: ['initiatedAt', 'desc'], limit: 60 });
  const ok = rows.filter(t => t.status === 'success'), waiting = rows.filter(t => t.status === 'awaiting_verification');
  const last = ok[0];
  return page(pageHead('Payments', 'Your registration, membership and marketplace payments, with receipts.'),
    rows.length ? metrics([[money(ok.reduce((a, t) => a + t.amount, 0)), 'Total paid'], [ok.length, 'Confirmed payments'], [waiting.length, 'Being confirmed'], [last ? fmtDT(last.completedAt).split(',')[0] : 'None', 'Last payment']]) : '',
    waiting.length ? html`<div class="notice c-blue small mt">${ic('hourglass')} ${waiting.length === 1 ? 'One payment is' : `${waiting.length} payments are`} being confirmed. You will get a notification and an email as soon as it is done.</div>` : '',
    html`<div class="mt-lg"></div>`,
    table([
      { h: 'Date', v: t => fmtDT(t.completedAt || t.submittedAt || t.initiatedAt) },
      { h: 'Description', v: t => html`${t.description}${t.simulated ? html` <span class="tag sim">Simulated</span>` : ''}` },
      { h: 'M-Pesa code', v: t => t.mpesaCode ? html`<code class="mp-chip">${t.mpesaCode}</code>` : html`<span class="faint">-</span>` },
      { h: 'Amount', right: true, v: t => html`<b>${money(t.amount)}</b>` },
      { h: 'Status', v: t => html`${badge(t.status === 'awaiting_verification' ? 'awaiting_verification' : t.status)}${STATUS_NOTE[t.status] || t.rejectReason ? html`<br><span class="xs faint">${t.rejectReason || STATUS_NOTE[t.status]}</span>` : ''}` },
      { h: '', act: true, v: t => t.status === 'success' || t.status === 'refunded' ? html`<button class="btn btn-sm btn-ghost" data-act="viewReceipt" data-id="${t.id}">${ic('receipt')} Receipt</button>` : t.status === 'pending' && t.provider === 'mpesa_manual' ? html`<button class="btn btn-sm btn-green" data-act="finishPayment" data-id="${t.id}">Enter M-Pesa code</button>` : '' }
    ], rows, emptyState('receipt', 'No payments yet', 'Your receipts will appear here.')));
}, 'Payments');
</script>
</body>
