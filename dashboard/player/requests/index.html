<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, A, badge, emptyState, table, run } from '/shared/js/ui.js';
import { appRoute, pageHead } from '/shared/js/features.js';

A.respondContact = d => run('respondContactRequest', { id: d.id, accept: !!d.v }, d.v ? 'Accepted. You can now message each other.' : 'Declined.').catch(() => {});
appRoute('/app/requests', async () => {
  const rows = await db.list('contactRequests', { where: [['participants', 'array-contains', S.uid]], limit: 30 });
  const mine = rows.filter(r => r.toUid === S.uid);
  return page(pageHead('Contact requests', 'Scouts, coaches and organisations who asked to connect. Accepting opens a chat. Your phone number is never shared.'),
    table([{ h: 'From', v: r => html`<span class="semi">${r.fromName}</span>` }, { h: 'Message', v: r => r.message }, { h: 'Status', v: r => badge(r.status) }, { h: '', act: true, v: r => r.status === 'pending' ? html`<button class="btn btn-sm btn-green" data-act="respondContact" data-id="${r.id}" data-v="1">Accept</button><button class="btn btn-sm btn-ghost" data-act="respondContact" data-id="${r.id}" data-v="">Decline</button>` : '' }], mine, emptyState('inbox', 'No requests', 'When a verified scout or coach reaches out, it will appear here.')));
}, 'Contact requests');
</script>
