<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { db } from '/shared/js/firebase.js';
import { page, S, badge, emptyState, table } from '/shared/js/ui.js';
import { appRoute, pageHead } from '/shared/js/features.js';

appRoute('/app/scout/requests', async () => {
  const rows = await db.list('contactRequests', { where: [['participants', 'array-contains', S.uid]], limit: 50 });
  return page(pageHead('Sent requests', ''), table([{ h: 'Player', v: r => r.toName }, { h: 'Message', v: r => r.message }, { h: 'Route', v: r => r.viaGuardian ? 'Through guardian' : 'Direct' }, { h: 'Status', v: r => badge(r.status) }], rows.filter(r => r.fromUid === S.uid), emptyState('inbox', 'No requests sent', 'Contact players from talent discovery.')));
}, 'Sent requests');
</script>
</body>
