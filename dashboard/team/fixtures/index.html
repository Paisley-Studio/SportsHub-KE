<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, titleCase, fmtDT } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, badge, emptyState, table } from '/shared/js/ui.js';
import { appRoute, pageHead, captainTeam, noTeam, teamTabs } from '/shared/js/features.js';

appRoute('/app/team/fixtures', async () => {
  const { team: t, mine } = await captainTeam(); if (!t) return noTeam();
  const rows = await db.list('fixtures', { where: [['teamIds', 'array-contains', t.id]], orderBy: ['start', 'desc'], limit: 60 });
  return page(pageHead('Fixtures', t.name, html`<a class="btn btn-green" href="#/app/team/challenges">${ic('swords')} New challenge</a>`), teamTabs(t, mine),
    table([{ h: 'Match', v: f => html`<span class="semi">${f.homeName} ${f.status === 'completed' ? `${f.homeScore} : ${f.awayScore}` : 'v'} ${f.awayName}</span>` }, { h: 'When', v: f => fmtDT(f.start) }, { h: 'Where', v: f => f.venue || '' }, { h: 'Type', v: f => titleCase(f.kind) }, { h: 'Status', v: f => badge(f.status) }, { h: '', act: true, v: f => f.status === 'scheduled' && !f.tournamentId ? html`<button class="btn btn-sm btn-ghost" data-act="recordScore" data-id="${f.id}" data-h="${f.homeName}" data-a="${f.awayName}">Enter result</button>` : '' }], rows, emptyState('calendar-days', 'No fixtures', 'Accepted challenges and tournament matches appear here.')));
}, 'Fixtures');
</script>
