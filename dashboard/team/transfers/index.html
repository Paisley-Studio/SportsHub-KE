<!doctype html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player transfers | SportsHub-KE</title>
<meta name="description" content="SportsHub-KE. One platform. Every sport. Every player.">
<meta name="theme-color" content="#FFFAF2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SportsHub-KE">
<meta property="og:title" content="Player transfers | SportsHub-KE">
<meta property="og:description" content="SportsHub-KE. One platform. Every sport. Every player.">
<meta property="og:image" content="/assets/photos/brand-banner.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/assets/branding/sportshub-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/sportshub.css">
<link rel="modulepreload" href="/shared/js/ui.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js" crossorigin>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, A, badge, emptyState, table, run } from '/shared/js/ui.js';
import { appRoute, pageHead } from '/shared/js/features.js';

A.reviewTeamTransfer = d => run('reviewTeamTransfer', { id: d.id, approve: !!d.v }, d.v ? 'Your approval was recorded.' : 'Transfer declined.').catch(() => {});
appRoute('/app/team/transfers', async () => {
  const rows = await db.list('teamTransfers', { where: [['officials', 'array-contains', S.uid]], limit: 40 });
  return page(pageHead('Player transfers', 'Officials of both teams must approve a move.'),
    table([{ h: 'Player', v: x => html`<a class="semi" href="#/players/${x.uid}">${x.name}</a>` }, { h: 'From', v: x => html`${x.fromName} ${x.fromApproved ? ic('check') : ''}` }, { h: 'To', v: x => html`${x.toName} ${x.toApproved ? ic('check') : ''}` }, { h: 'Reason', v: x => x.reason }, { h: 'Status', v: x => badge(x.status) }, { h: '', act: true, v: x => x.status === 'pending' ? html`<button class="btn btn-sm btn-green" data-act="reviewTeamTransfer" data-id="${x.id}" data-v="1">Approve</button><button class="btn btn-sm btn-ghost" data-act="reviewTeamTransfer" data-id="${x.id}" data-v="">Decline</button>` : '' }], rows, emptyState('arrow-left-right', 'No transfer requests', 'Requests from your players will appear here.')));
}, 'Player transfers');
</script>
</body>
</html>
