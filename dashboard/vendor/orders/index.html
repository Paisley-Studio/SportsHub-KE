<script type="module">
import { html, money, fmtDate } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, badge, emptyState, table } from '/shared/js/ui.js';
import { appRoute, pageHead, vendorGate } from '/shared/js/features.js';

appRoute('/app/store/orders', async () => {
  const { gate } = await vendorGate(); if (gate) return gate;
  const rows = await db.list('orders', { where: [['vendorId', '==', S.uid]], orderBy: ['createdAt', 'desc'], limit: 80 });
  const next = { paid: 'processing', processing: 'shipped', shipped: 'delivered' };
  return page(pageHead('Orders', 'Move orders through their lifecycle. Customers are notified at each step.'),
    table([{ h: 'Order', v: o => html`<span class="semi">${o.number}</span><br><span class="xs faint">${fmtDate(o.createdAt)}</span>` }, { h: 'Customer', v: o => html`${o.buyerName}<br><span class="xs faint">${o.delivery.county}: ${o.delivery.address}</span>` }, { h: 'Items', v: o => o.items.map(i => `${i.qty} × ${i.title}${i.size ? ` (${i.size})` : ''}`).join(', ') }, { h: 'Total', right: true, v: o => money(o.total) }, { h: 'Status', v: o => badge(o.status) }, { h: '', act: true, v: o => html`${next[o.status] ? html`<button class="btn btn-sm btn-magenta" data-act="orderTo" data-id="${o.id}" data-v="${next[o.status]}">Mark ${next[o.status]}</button>` : ''}${['paid', 'processing'].includes(o.status) ? html`<button class="btn btn-sm btn-ghost" data-act="orderTo" data-id="${o.id}" data-v="cancelled">Cancel</button>` : ''}<button class="btn btn-sm btn-ghost" data-act="contactSeller" data-v="${o.buyerId}" data-title="Order ${o.number}">Message</button>` }], rows, emptyState('shopping-bag', 'No orders yet', 'Orders appear here the moment they are paid.')));
}, 'Orders');
</script>
