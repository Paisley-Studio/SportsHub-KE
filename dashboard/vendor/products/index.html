<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { CATEGORY_ICON, html, ic, money } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { page, S, A, badge, emptyState, table, confirmBox, run } from '/shared/js/ui.js';
import { appRoute, pageHead, vendorGate } from '/shared/js/features.js';

A.removeProduct = async d => { if (await confirmBox('Remove this product?', 'It will no longer be shown to customers.', 'Remove', 'btn-bad')) await run('removeProduct', { id: d.id }, 'Product removed.').catch(() => {}); };
appRoute('/app/store/products', async () => {
  const { gate } = await vendorGate(); if (gate) return gate;
  const rows = (await db.list('products', { where: [['vendorId', '==', S.uid]], limit: 200 })).filter(p => p.status !== 'hidden');
  return page(pageHead('Products and inventory', 'New products go live after moderation.', html`<button class="btn btn-magenta" data-act="editProduct">${ic('plus')} Add a product</button>`),
    table([{ h: 'Product', v: p => html`<a class="row nowrap" href="#/marketplace/product/${p.id}">${p.photo ? html`<img class="avatar sq" src="${p.photo}" alt="" loading="lazy">` : html`<span class="avatar sq">${ic(CATEGORY_ICON[p.category] || 'package')}</span>`}<span><span class="semi" style="display:block">${p.title}</span><span class="xs faint">${p.category}</span></span></a>` }, { h: 'Price', right: true, v: p => money(p.salePrice || p.price) }, { h: 'Stock', right: true, v: p => p.stock }, { h: 'Sold', right: true, v: p => p.sold || 0 }, { h: 'Status', v: p => badge(p.status === 'active' ? 'active' : p.status) }, { h: '', act: true, v: p => html`<button class="btn btn-sm btn-ghost" data-act="editProduct" data-id="${p.id}">Edit</button><button class="btn btn-sm btn-ghost" data-act="removeProduct" data-id="${p.id}" aria-label="Remove ${p.title}">${ic('trash-2')}</button>` }], rows, emptyState('package', 'No products yet', 'List your first product.')));
}, 'Products and inventory');
</script>
</body>
