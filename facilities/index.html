<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Find pitches, courts, pools and gyms.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="SportsHub-KE">
<meta property="og:title" content="Grounds, courts, pools and gyms | SportsHub-KE">
<meta property="og:description" content="Find pitches, courts, pools and gyms.">
<meta property="og:image" content="/assets/photos/brand-banner.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/assets/branding/sportshub-symbol.svg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { COUNTY_NAMES, html, raw, money } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, verifiedMark, emptyState, route, adSlot, pgHero } from '/shared/js/ui.js';
import { filterSelect } from '/shared/js/features.js';

/* ----- Facilities & booking ----- */
route('/facilities', async () => {
  const q = S.query, where = [['status', '==', 'approved']];
  if (q.county) where.push(['county', '==', q.county]);
  if (q.sport) where.push(['sportIds', 'array-contains', q.sport]);
  let rows = await db.list('facilities', { where, limit: 60 });
  if (q.covered) rows = rows.filter(f => f.participating);
  const ad = await adSlot('facility_discovery');
  return html`${pgHero({ c: 'green', c2: 'yellow', eye: 'Sports facilities', title: 'Grounds, courts, pools and gyms', lede: 'Participating venues accept SportsHub membership sessions with no ground-access fee. Availability depends on each venue.', action: html`<a class="btn btn-green" href="#/join/facility">List your facility</a>` })}<div class="wrap section tight">
    <div class="grid mb" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">${filterSelect('sport', 'Sport', q.sport, S.sports.map(s => [s.id, s.name]), 'Every sport')}${filterSelect('county', 'County', q.county, COUNTY_NAMES, 'All counties')}<label class="tick" style="align-self:end;padding-bottom:10px"><input type="checkbox" name="covered" data-filter ${q.covered ? raw('checked') : ''}><span>Membership venues only</span></label></div>
    ${ad}
    ${rows.length ? html`<div class="grid g3 mt">${rows.map((f, i) => html`<a class="stack sm rv u" style="--d:${(i % 3) * .08}s" href="#/facilities/${f.id}"><span class="pic r-43">${f.photos && f.photos[0] ? html`<img src="${f.photos[0]}" alt="" loading="lazy">` : ''}</span><span class="row between"><span class="semi">${f.name}</span></span><span class="small muted">${f.town}, ${f.county} · from ${money(f.priceFrom)}/hr</span><span class="row">${f.verified ? verifiedMark() : ''}${f.participating ? html`<span class="badge ok">Membership venue</span>` : html`<span class="badge">Pay per booking</span>`}</span></a>`)}</div>` : emptyState('map-pin', 'No facilities match', 'Try another county or sport.')}</div>`;
}, { title: 'Facilities', desc: 'Find pitches, courts, pools and gyms.' });
</script>
</body>
</html>
