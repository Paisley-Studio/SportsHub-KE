<body>

<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { COUNTY_NAMES, html, money } from '/shared/js/core.js';
import { db, callOp } from '/shared/js/firebase.js';
import { S, F, toast, fld, go, route, refreshSession, pgHero } from '/shared/js/ui.js';
import { saveCart, paymentFlow } from '/shared/js/features.js';

F.placeOrder = async v => {
  const r = await callOp('placeOrder', { items: S.cart, delivery: v });
  S.cart = []; await saveCart();
  const outcome = await paymentFlow({ txId: r.txId, amount: r.amount, description: 'Marketplace order' });
  await refreshSession();
  go('/app/orders');
  if (outcome === 'success') toast('Order paid. The seller has been notified.', 'green');
  else if (outcome === 'submitted') toast('Payment submitted. Your order goes to the seller once we confirm it.', 'blue');
};
route('/checkout', async () => {
  if (!S.cart.length) { go('/cart', true); return undefined; }
  const items = await Promise.all(S.cart.map(async i => ({ ...i, p: await db.get('products', i.productId) })));
  const total = items.reduce((a, i) => a + (i.p ? (i.p.salePrice || i.p.price) * i.qty : 0), 0);
  const priv = await db.get('usersPrivate', S.uid);
  return html`${pgHero({ c: 'magenta', c2: 'green', eye: 'Marketplace', title: 'Checkout' })}<div class="wrap section tight c-magenta"><div class="grid g-side"><form class="form" id="checkout" data-form="placeOrder"><div class="form-grid">
      ${fld({ name: 'name', label: 'Recipient name', value: S.user.name, required: true })}${fld({ name: 'phone', label: 'Phone for delivery', type: 'tel', value: (priv && priv.phone) || '', required: true })}${fld({ name: 'county', label: 'County', type: 'select', value: S.user.county, options: COUNTY_NAMES, required: true })}${fld({ name: 'address', label: 'Delivery or pick-up location', required: true, placeholder: 'Town and a landmark' })}</div>
      <p class="form-err err hide"></p></form>
    <aside class="panel stack"><div class="lines small">${items.filter(i => i.p).map(i => html`<div class="row between nowrap"><span>${i.qty} × ${i.p.title}</span><span class="nums">${money((i.p.salePrice || i.p.price) * i.qty)}</span></div>`)}</div><div class="row between"><span class="semi">Total</span><span class="price" style="font-size:1.2rem">${money(total)}</span></div>
      <button class="btn btn-magenta btn-block" form="checkout" type="submit">Place order and pay</button>${''}</aside></div></div>`;
}, { title: 'Checkout', auth: true });
</script>
</body>
