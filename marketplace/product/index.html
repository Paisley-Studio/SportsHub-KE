<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { CATEGORY_ICON, html, raw, ic, money } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, F, toast, stars, fld, go, notFound, route } from '/shared/js/ui.js';
import { saveCart } from '/shared/js/features.js';

F.addToCart = async v => {
  if (!S.uid) { S.afterLogin = location.pathname + location.search; toast('Sign in to add items to your cart.'); go('/signin'); return; }
  const line = S.cart.find(i => i.productId === v.productId && i.size === (v.size || '') && i.colour === (v.colour || ''));
  if (line) line.qty += Number(v.qty || 1); else S.cart.push({ productId: v.productId, qty: Number(v.qty || 1), size: v.size || '', colour: v.colour || '' });
  await saveCart();
  toast('Added to your cart.', 'magenta');
};
route('/marketplace/product/:id', async ({ id }) => {
  const p = await db.get('products', id);
  if (!p) return notFound();
  S.pageTitle = p.title;
  S.pageDesc = `${p.title}, KES ${p.salePrice || p.price} from ${p.storeName || 'a verified seller'}. ${String(p.description || '').slice(0, 100)} Buy on the SportsHub-KE marketplace.`;
  S.pageImage = p.photo;
  S.pageLd = { '@type': 'Product', name: p.title, description: p.description || '', category: p.category || '', ...(p.photo ? { image: new URL(p.photo, location.href).href } : {}), brand: { '@type': 'Brand', name: p.storeName || 'SportsHub-KE seller' }, ...(p.reviewCount ? { aggregateRating: { '@type': 'AggregateRating', ratingValue: p.rating, reviewCount: p.reviewCount } } : {}), offers: { '@type': 'Offer', price: p.salePrice || p.price, priceCurrency: 'KES', availability: p.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock', seller: { '@type': 'Organization', name: p.storeName || 'SportsHub-KE seller' }, url: location.href } };
  const reviews = await db.list('reviews', { where: [['targetType', '==', 'product'], ['targetId', '==', id]], limit: 10 });
  const out = p.stock < 1;
  return html`<div class="pg-hero" style="padding-bottom:0;--c:var(--magenta);--c2:var(--yellow)"></div><div class="wrap section tight c-magenta"><a class="small muted" href="#/marketplace">${ic('arrow-left')} Marketplace</a>
    <div class="grid g-5-7 mt"><div class="prod"><div class="pic" style="margin:0">${p.photo ? html`<img src="${p.photo}" alt="${p.title}">` : html`<span class="noimg">${ic(CATEGORY_ICON[p.category] || 'package')}</span>`}</div></div>
    <form class="stack" data-form="addToCart" data-id="${p.id}"><input type="hidden" name="productId" value="${p.id}"><span class="eyebrow">${p.category}</span><h1 style="font-size:clamp(1.7rem,3vw,2.5rem)">${p.title}</h1>
      <a class="small semi" href="#/marketplace/store/${p.storeId}">Sold by ${p.storeName}</a>
      <div class="row"><span class="price" style="font-size:1.5rem">${money(p.salePrice || p.price)}</span>${p.salePrice ? html`<span class="was">${money(p.price)}</span>` : ''}</div>
      ${p.reviewCount ? html`<div class="row sm">${stars(p.rating)}<span class="small muted">${p.reviewCount} reviews</span></div>` : ''}
      <p class="muted">${p.description}</p>
      ${p.sizes.length ? fld({ name: 'size', label: 'Size', type: 'select', options: p.sizes, required: true }) : ''}
      ${p.colours.length ? fld({ name: 'colour', label: 'Colour', type: 'select', options: p.colours, required: true }) : ''}
      ${fld({ name: 'qty', label: 'Quantity', type: 'number', value: '1', min: 1, max: Math.max(1, p.stock), required: true })}
      <span class="small ${p.stock < 5 ? 'semi' : 'muted'}">${out ? 'Out of stock' : `${p.stock} in stock`}</span>
      <div class="row"><button class="btn btn-magenta" type="submit" ${out ? raw('disabled') : ''}>${ic('shopping-bag')} Add to cart</button>${S.uid && S.uid !== p.vendorId ? html`<button type="button" class="btn btn-ghost" data-act="contactSeller" data-v="${p.vendorId}" data-title="${p.storeName}">Ask the seller</button>` : ''}<button type="button" class="btn btn-ghost" data-act="reportThing" data-type="product" data-id="${p.id}" data-text="${p.title}">${ic('flag')}</button></div></form></div>
    <div class="panel section tight"><div class="panel-head"><h3>Customer reviews</h3>${S.uid ? html`<button class="btn btn-ghost btn-sm" data-act="writeReview" data-type="product" data-id="${p.id}">Review this product</button>` : ''}</div>${reviews.length ? html`<div class="lines">${reviews.map(r => html`<div>${stars(r.rating)}<p class="small">${r.text}</p><span class="xs faint">${r.name}, verified purchase</span></div>`)}</div>` : html`<p class="small muted">No reviews yet. Only customers with a completed order can review.</p>`}</div></div>`;
});
</script>
