<!doctype html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SportsHub-KE | One platform. Every sport. Every player.</title>
<meta name="description" content="SportsHub-KE. One platform. Every sport. Every player.">
<meta name="theme-color" content="#FFFAF2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SportsHub-KE">
<meta property="og:title" content="SportsHub-KE | One platform. Every sport. Every player.">
<meta property="og:description" content="SportsHub-KE. One platform. Every sport. Every player.">
<meta property="og:image" content="/assets/photos/brand-banner.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/assets/branding/sportshub-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/sportshub.css">
<link rel="modulepreload" href="/shared/js/ui.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js" crossorigin>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, avatar, verifiedMark, stars, emptyState, notFound, route, pgHero } from '/shared/js/ui.js';
import { productCard } from '/shared/js/features.js';

route('/marketplace/store/:id', async ({ id }) => {
  const s = await db.get('stores', id);
  if (!s) return notFound();
  S.pageTitle = s.name;
  const rows = await db.list('products', { where: [['storeId', '==', id], ['status', '==', 'active']], limit: 60 });
  return html`${pgHero({ c: 'magenta', c2: 'yellow', eye: 'Storefront', title: s.name })}<div><div class="wrap section tight c-magenta"><div class="row top" style="gap:18px">${avatar(s.name, s.logo, 'lg sq')}<div class="stack sm grow"><div class="row">${s.verified ? verifiedMark() : ''}<span class="small muted">${s.town}, ${s.county}</span>${s.reviewCount ? html`<span class="row sm">${stars(s.rating)}<span class="small muted">${s.rating}</span></span>` : ''}</div><p class="muted">${s.description}</p>${s.promotion ? html`<div class="notice c-magenta">${s.promotion}</div>` : ''}</div>${S.uid && S.uid !== s.vendorId ? html`<button class="btn btn-ghost" data-act="contactSeller" data-v="${s.vendorId}" data-title="${s.name}">${ic('message-square')} Contact seller</button>` : ''}</div>
    <div class="prods mt-lg">${rows.map(productCard)}</div>${rows.length ? '' : emptyState('package', 'No products yet', 'This store is still stocking its shelves.')}</div></div>`;
});
</script>
</body>
</html>
