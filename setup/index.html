<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { img, html, SPORTS_CATALOGUE } from '/shared/js/core.js';
import { db, callOp } from '/shared/js/firebase.js';
import { S, A, toast, go, route, refreshSession } from '/shared/js/ui.js';

A.runBootstrap = async () => {
  const r = await callOp('bootstrapPlatform', { sports: SPORTS_CATALOGUE.map(s => ({ ...s, photo: s.photo ? img(s.photo) : '' })) });
  S.sports = await db.list('sports', { limit: 100 }); await refreshSession();
  toast(`Setup complete. ${r.sports} sports loaded.`, 'green'); go('/admin');
};
/* ----- First-run setup for a new production project ----- */
route('/setup', async () => {
  
  if (!S.uid) { S.afterLogin = '/setup'; go('/signin', true); return undefined; }
  return html`<div class="wrap section" style="max-width:640px"><h1 class="mb">Platform setup</h1><p class="muted mb">Loads the sports catalogue and default settings, and makes you Super Administrator. It works only for the account whose email matches SUPERADMIN_EMAIL on the server.</p><button class="btn" data-act="runBootstrap">Run setup</button></div>`;
}, { title: 'Platform setup' });
</script>
