<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Football, basketball, athletics, golf, tennis, swimming and more.">
<meta name="theme-color" content="#FFFAF2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SportsHub-KE">
<meta property="og:title" content="Every sport, configured properly | SportsHub-KE">
<meta property="og:description" content="Football, basketball, athletics, golf, tennis, swimming and more.">
<meta property="og:image" content="/assets/photos/brand-banner.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/assets/branding/sportshub-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="modulepreload" href="/shared/js/ui.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js" crossorigin>

<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, titleCase } from '/shared/js/core.js';
import { S, sportC, route, pgHero } from '/shared/js/ui.js';

/* ----- Sports ----- */
route('/sports', async () => html`${pgHero({ c: 'green', c2: 'yellow', eye: 'Sports directory', title: 'Every sport, configured properly', lede: 'Each sport has its own formats, positions, statistics and competition rules.', cut: 'runner' })}<div class="wrap section tight">
  <div class="cards3" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))">${S.sports.filter(s => s.active !== false).map((s, i) => html`<a class="game-card ${sportC(s.id)} rv u" style="--d:${(i % 4) * .06}s" href="#/sports/${s.id}"><div class="gc-img" style="height:150px;display:flex;align-items:center;justify-content:center;color:var(--con)">${s.photo ? html`<img src="${s.photo}" alt="" loading="lazy">` : html`<svg class="i" style="width:48px;height:48px;stroke-width:1.4" aria-hidden="true"><use href="/assets/icons.svg#i-${s.icon}"/></svg>`}</div><div class="gc-b"><h3>${s.name}</h3><span class="xs faint">${titleCase(s.type)}${s.formats.length ? ` · ${s.formats.slice(0, 2).join(', ')}` : ''}</span></div></a>`)}</div></div>`, { title: 'Sports', desc: 'Football, basketball, athletics, golf, tennis, swimming and more.' });
</script>
</body>
</html>
