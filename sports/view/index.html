<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, titleCase } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, sportC, badge, emptyState, sectionHead, notFound, route, pgHero } from '/shared/js/ui.js';
import { qUpcoming, gameRow, teamLine } from '/shared/js/features.js';

route('/sports/:id', async ({ id }) => {
  const s = await db.get('sports', id);
  if (!s) return notFound();
  S.pageTitle = s.name;
  S.pageDesc = `${s.name} in Kenya: find ${s.name.toLowerCase()} games, teams, coaches and venues near you${(s.formats || []).length ? `, from ${s.formats.slice(0, 3).join(', ')}` : ''}. Play with one SportsHub-KE membership.`;
  S.pageImage = s.photo;
  const [games, teams, comps] = await Promise.all([db.list('games', qUpcoming([['sportId', '==', id]], 8)), db.list('teams', { where: [['sportId', '==', id]], limit: 6 }), db.list('tournaments', { where: [['sportId', '==', id]], limit: 4 })]);
  const CUTS = { football: 'footballer', basketball: 'dunk', athletics: 'runner', golf: 'golfer', tennis: 'tennis', 'road-running': 'runner' };
  return html`${pgHero({ c: s.color || 'blue', c2: 'yellow', eye: 'Sport', title: s.name, lede: s.scoring ? `Scored by ${s.scoring.toLowerCase()}. ${titleCase(s.type)} sport.` : '', cut: CUTS[id] })}<div class="wrap section tight ${sportC(id)}"><div class="grid g-5-7">
      <div class="stack">
        <dl class="kv">${s.disciplines.length ? html`<dt>Disciplines</dt><dd>${s.disciplines.join(', ')}</dd>` : ''}${s.positions.length ? html`<dt>Positions</dt><dd>${s.positions.join(', ')}</dd>` : ''}${s.formats.length ? html`<dt>Formats</dt><dd>${s.formats.join(', ')}</dd>` : ''}<dt>Scoring</dt><dd>${s.scoring || 'Configured per event'}</dd><dt>Tracked</dt><dd>${s.statFields.map(f => f.label).join(', ') || 'Attendance'}</dd>${s.facilityRequirements.length ? html`<dt>Needs</dt><dd>${s.facilityRequirements.join(', ')}</dd>` : ''}</dl>
        <div class="row"><a class="btn" style="background:var(--c);color:var(--con)" href="#/games?sport=${id}">Find ${s.name.toLowerCase()} games</a><a class="btn btn-ghost" href="#/facilities?sport=${id}">Find venues</a></div></div>
      ${s.photo ? html`<span class="pic r-169"><img src="${s.photo}" alt="" loading="lazy"></span>` : ''}</div>
    <div class="grid g-side section tight"><div>${sectionHead('blue', 'Open games', `${s.name} coming up`)}${games.length ? html`<div class="board">${games.map(g => gameRow(g))}</div>` : emptyState('calendar-days', 'No games yet', `No ${s.name.toLowerCase()} games are open right now.`, html`<a class="btn" href="#/app/games/new">Host one</a>`)}</div>
      <aside class="stack lg"><div class="panel"><div class="panel-head"><h3>Teams</h3></div><div class="lines">${teams.length ? teams.map(t => html`<div>${teamLine(t)}</div>`) : html`<p class="small muted">No teams yet.</p>`}</div></div>
      <div class="panel"><div class="panel-head"><h3>Competitions</h3></div><div class="lines">${comps.length ? comps.map(t => html`<div><a class="line-row" href="#/tournaments/${t.id}"><span class="grow t semi">${t.name}</span>${badge(t.status)}</a></div>`) : html`<p class="small muted">None listed.</p>`}</div></div></aside></div></div>`;
});
</script>
