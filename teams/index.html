<script type="module">
import { COUNTY_NAMES, SKILLS, html, raw, ic, scoreTeam } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, emptyState, route, pgHero } from '/shared/js/ui.js';
import { teamLine, filterSelect } from '/shared/js/features.js';

/* ----- Teams ----- */
route('/teams', async () => {
  const q = S.query, where = [];
  if (q.sport) where.push(['sportId', '==', q.sport]);
  if (q.county) where.push(['county', '==', q.county]);
  let rows = await db.list('teams', { where, limit: 60 });
  if (q.skill) rows = rows.filter(t => t.skill === q.skill);
  if (q.recruiting) rows = rows.filter(t => t.recruiting);
  if (S.profile) rows = rows.map(t => ({ ...t, _m: scoreTeam(t, S.profile) })).sort((a, b) => b._m.score - a._m.score);
  return html`${pgHero({ c: 'green', c2: 'blue', eye: 'Teams and clubs', title: 'Find your team', lede: S.profile ? 'Ranked by your sport, county, level and the positions teams need.' : 'Teams and clubs recruiting across the country.', cut: 'guard', action: html`<a class="btn btn-green" href="#/app/teams/new">${ic('plus')} Register a team</a>` })}<div class="wrap section tight">
    <div class="grid mb" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">${filterSelect('sport', 'Sport', q.sport, S.sports.map(s => [s.id, s.name]), 'Every sport')}${filterSelect('county', 'County', q.county, COUNTY_NAMES, 'All counties')}${filterSelect('skill', 'Level', q.skill, SKILLS, 'Any level')}<label class="tick" style="align-self:end;padding-bottom:10px"><input type="checkbox" name="recruiting" data-filter ${q.recruiting ? raw('checked') : ''}><span>Recruiting now</span></label></div>
    ${rows.length ? html`<div class="panel lines">${rows.map(t => html`<div class="seq">${teamLine(t, t._m && t._m.reasons)}</div>`)}</div>` : emptyState('users', 'No teams match', 'Try a nearby county, or register your own team.')}
  </div>`;
}, { title: 'Teams', desc: 'Teams and clubs recruiting across Kenya.' });
</script>
