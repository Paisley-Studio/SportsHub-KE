<div id="bar"></div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html, ic, titleCase } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, SPORT, A, badge, avatar, metrics, fld, promptForm, run, notFound, route, pgHero } from '/shared/js/ui.js';
import { TrustedOpsIsOfficial, fixtureLine } from '/shared/js/features.js';

A.requestJoinTeam = async d => {
  const v = await promptForm({ title: 'Request to join', intro: 'The captain will be notified. Your phone number is never shared.', fields: fld({ name: 'message', label: 'Message to the captain', type: 'textarea', full: true, placeholder: 'Your position, and when you can train.' }), submit: 'Send request' });
  if (v) await run('teamRequestJoin', { teamId: d.id, message: v.message }, 'Request sent.').catch(() => {});
};
route('/teams/:id', async ({ id }) => {
  const t = await db.get('teams', id);
  if (!t) return notFound();
  S.pageTitle = t.name;
  S.pageDesc = `${t.name}: ${t.sportName || 'sports'} team in ${[t.town, t.county].filter(Boolean).join(', ') || 'Kenya'}. ${t.memberCount || 0} players.${t.recruiting ? ' Recruiting now.' : ''} ${String(t.description || '').slice(0, 80)}`;
  S.pageImage = t.logo;
  S.pageLd = { '@type': 'SportsTeam', name: t.name, sport: t.sportName || '', description: t.description || '', ...(t.logo ? { logo: new URL(t.logo, location.href).href } : {}), location: { '@type': 'Place', address: { '@type': 'PostalAddress', addressLocality: t.town || '', addressRegion: t.county || '', addressCountry: 'KE' } }, url: location.href };
  const members = S.uid ? (await db.list('teamMembers', { where: [['teamId', '==', id], ['status', '==', 'active']], limit: 80 })) : [];
  const mine = S.uid ? await db.get('teamMembers', `${id}_${S.uid}`) : null;
  const fixtures = await db.list('fixtures', { where: [['teamIds', 'array-contains', id]], orderBy: ['start', 'desc'], limit: 12 });
  const st = t.stats || {}, isOff = S.uid && TrustedOpsIsOfficial(t), up = fixtures.filter(f => f.status === 'scheduled').reverse(), done = fixtures.filter(f => f.status === 'completed');
  return html`${pgHero({ c: SPORT(t.sportId).color || 'green', c2: 'yellow', eye: `${t.sportName}${t.format ? ` · ${t.format}` : ''}`, title: t.name, lede: `${t.town}, ${t.county} · ${t.skill}${(t.lookingFor || []).length ? ` · Looking for: ${t.lookingFor.join(', ')}` : ''}` })}<div class="wrap section tight"><div class="row between">${avatar(t.name, t.logo, 'lg sq')}
      <div class="row">${isOff ? html`<a class="btn" href="#/app/team">Manage team</a>` : ''}
      ${S.uid && !isOff && !(mine && mine.status === 'active') && t.recruiting && (!mine || mine.status === 'removed') ? html`<button class="btn btn-green" data-act="requestJoinTeam" data-id="${id}">Request to join</button>` : ''}
      ${mine && mine.status === 'requested' ? badge('requested') : ''}
      ${mine && mine.status === 'invited' ? html`<button class="btn" data-act="respondInvite" data-id="${id}" data-v="1">Accept invitation</button><button class="btn btn-ghost" data-act="respondInvite" data-id="${id}" data-v="">Decline</button>` : ''}
      ${!S.uid ? html`<a class="btn btn-green" href="#/signin">Sign in to join</a>` : ''}</div></div>
    ${t.description ? html`<p class="lede mt">${t.description}</p>` : ''}
    <div class="mt-lg">${metrics([[st.played || 0, 'Played'], [st.won || 0, 'Won'], [st.drawn || 0, 'Drawn'], [st.lost || 0, 'Lost'], [st.for || 0, 'Scored'], [t.memberCount || 0, 'Members']])}</div>
    <div class="grid g-side section tight"><div class="stack lg">
      <div class="panel"><h3 class="mb">Upcoming fixtures</h3>${up.length ? html`<div class="lines">${up.map(fixtureLine)}</div>` : html`<p class="small muted">No fixtures scheduled.</p>`}</div>
      <div class="panel"><h3 class="mb">Results</h3>${done.length ? html`<div class="lines">${done.map(fixtureLine)}</div>` : html`<p class="small muted">No results yet.</p>`}</div></div>
      <aside class="stack lg"><div class="panel"><h3 class="mb">Squad</h3>${S.uid ? html`<div class="lines">${members.map(m => html`<div class="row between"><a class="semi" href="#/players/${m.uid}">${m.name}</a><span class="small muted">${titleCase(m.role)}</span></div>`)}</div>` : html`<p class="small muted">Sign in to see the squad.</p>`}</div>
      ${(t.achievements || []).length ? html`<div class="panel"><h3 class="mb">Achievements</h3><ul class="stack sm small">${t.achievements.map(a => html`<li class="row sm">${ic('trophy')} ${a}</li>`)}</ul></div>` : ''}</aside></div></div>`;
});
</script>
