<html lang="en-KE">
<head>
<meta charset="utf-8">

<meta name="description" content="Knockouts, leagues and individual competitions.">
<meta name="theme-color" content="#FFFAF2">
<meta property="og:type" content="website">

<meta property="og:title" content="Something to play for | SportsHub-KE">
<meta property="og:description" content="Knockouts, leagues and individual competitions.">
<meta property="og:image" content="/assets/photos/brand-banner.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/assets/branding/sportshub-symbol.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<a class="skip" href="#main">Skip to content</a>
<div id="bar"></div>
<div id="root"><main id="main" tabindex="-1"></main></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><div class="wrap section"><h1>SportsHub-KE</h1><p>One platform. Every sport. Every player. Please enable JavaScript to use the platform.</p></div></noscript>
<script type="module">
import { html } from '/shared/js/core.js';
import { db } from '/shared/js/firebase.js';
import { S, hasRole, emptyState, route, adSlot, pgHero } from '/shared/js/ui.js';
import { filterSelect, compRow } from '/shared/js/features.js';

/* ----- Tournaments ----- */
route('/tournaments', async () => {
  const q = S.query, where = [];
  if (q.sport) where.push(['sportId', '==', q.sport]);
  let rows = await db.list('tournaments', { where, orderBy: ['start', 'desc'], limit: 40 });
  if (q.status) rows = rows.filter(t => t.status === q.status);
  rows = rows.filter(t => t.status !== 'draft');
  const ad = await adSlot('tournament');
  return html`${pgHero({ c: 'yellow', c2: 'magenta', eye: 'Tournaments and competitions', title: 'Something to play for', lede: 'Knockouts, leagues and individual competitions, with real standings.', cut: 'javelin', action: hasRole('organiser') ? html`<a class="btn btn-yellow" href="#/app/org/competitions">Create a competition</a>` : html`<a class="btn btn-yellow" href="#/join/organisation">Become an organiser</a>` })}<div class="wrap section tight c-yellow">
    <div class="grid mb" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">${filterSelect('sport', 'Sport', q.sport, S.sports.map(s => [s.id, s.name]), 'Every sport')}${filterSelect('status', 'Status', q.status, [['open', 'Open for entries'], ['running', 'In progress'], ['finished', 'Finished']], 'Any status')}</div>
    ${ad}${rows.length ? html`<div class="mt">${rows.map(compRow)}</div>` : emptyState('trophy', 'No competitions match', 'Try another sport or status.')}</div>`;
}, { title: 'Tournaments', desc: 'Knockouts, leagues and individual competitions.' });
</script>
</body>
</html>
