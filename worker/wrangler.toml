# SportsHub-KE server: trusted operations (account creation and every other protected change),
# R2 upload signing, the daily membership sweep and the M-Pesa callback. Replaces Firebase Cloud Functions.
# Secrets (never put them here; set with `npx wrangler secret put NAME`):
#   FIREBASE_SERVICE_ACCOUNT   the whole service-account JSON key (Firebase console > Project settings > Service accounts)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   SUPERADMIN_EMAIL           the account allowed to run first-time setup at /setup/
#   MPESA_CALLBACK_TOKEN       only once M-Pesa is installed
name = "sportshub-uploads"
main = "src/index.js"
compatibility_date = "2025-09-01"
# The AWS SDK needs the Node.js compatibility layer.
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sports-hub-buckets"

# 00:05 in Nairobi (21:05 UTC): close expired membership months, send renewal reminders.
[triggers]
crons = ["5 21 * * *"]

[vars]
R2_BUCKET = "sports-hub-buckets"
FIREBASE_PROJECT_ID = "sportshub-9c219"
# Public address of the bucket (r2.dev subdomain or a custom domain such as https://media.sportshub.co.ke).
# Leave empty to serve files through this Worker at /files/<key>.
PUBLIC_BASE = ""
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,https://sportshub.co.ke,https://www.sportshub.co.ke,https://sportshub-9c219.web.app,https://sportshub-9c219.firebaseapp.com"
PAYMENT_PROVIDER = "simulation"
# "true" only while testing before a real payment provider is installed. Never with real users.
ALLOW_SIMULATED_PAYMENTS = "false"
RATE_LIMIT_PER_MINUTE = "90"
